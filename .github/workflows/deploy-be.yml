name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Build
        run: pnpm build

      - name: Prepare deploy bundle
        # 핵심: 'dist' 폴더(빌드 결과물)를 반드시 포함해야 서버에서 실행됩니다.
        # src는 서버에서 필요 없으므로 제외하고 컴파일된 dist를 넣습니다.
        run: |
          mkdir -p deploy-app
          cp package.json pnpm-lock.yaml deploy-app/
          cp -r dist prisma deploy-app/
          cd deploy-app && tar czf ../deploy.tar.gz .

      - name: Upload bundle via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: deploy.tar.gz
          # 실제 서버 경로인 ~/fs9-fitness-reservation-be로 수정했습니다.
          target: ~/fs9-fitness-reservation-be/

      - name: Extract and restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            # 1. 폴더 이동 및 압축 해제
            cd ~/fs9-fitness-reservation-be
            mkdir -p app
            find app -mindepth 1 -delete 2>/dev/null || true
            tar xzf deploy.tar.gz -C app
            
            # 2. 실행 준비 (서버에서 pnpm install 실행)
            cd app
            pnpm install --frozen-lockfile --prod
            pnpm prisma:generate
            
            # 3. DB 마이그레이션 (스키마 변경 반영)
            # DATABASE_URL 시크릿이 필요합니다.
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            pnpm prisma migrate deploy
            
            # 4. 서비스 재시작
            (pm2 restart fitmatch-be || pm2 start pnpm --name fitmatch-be -- start)