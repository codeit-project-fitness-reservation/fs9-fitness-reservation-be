name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env file
        run: |
          cat > .env << 'BE_ENV_END'
          ${{ secrets.BE_ENV }}
          BE_ENV_END

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Build
        run: pnpm build

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy-app
          cp package.json pnpm-lock.yaml deploy-app/
          cp -r src prisma deploy-app/
          cd deploy-app && tar czf ../deploy.tar.gz .

      - name: Upload bundle via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: deploy.tar.gz
          target: ~/fs9-fitness-reservation-be/

      - name: Extract and restart on server
        uses: appleboy/ssh-action@v1
        env:
          BE_ENV: ${{ secrets.BE_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: BE_ENV
          script: |
            set -e
            cd ~/fs9-fitness-reservation-be
            find . -mindepth 1 -maxdepth 1 ! -name 'deploy.tar.gz' -exec rm -rf {} +
            tar xzf deploy.tar.gz -C .
            echo "$BE_ENV" > .env
            pnpm install --frozen-lockfile --prod --ignore-scripts
            pnpm prisma:generate
            pnpm prisma migrate deploy
            pm2 reload fitmatch-be --update-env || pm2 start pnpm --name fitmatch-be -- start